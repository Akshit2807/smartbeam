[theme]
base = "dark"
primaryColor = "#2D6CDF"
backgroundColor = "#0A1B33"
secondaryBackgroundColor = "#0E2847"
textColor = "#F7F3E8"
borderColor = "#1F4A80"
linkColor = "#7EA2E3"
font = "Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"
codeFont = "'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace"
baseRadius = "0.6rem"
chartCategoricalColors = ["#2D6CDF", "#DCC9A1", "#F7F3E8", "#5FBF8F", "#7EA2E3", "#E06A5A"]

[theme.sidebar]
backgroundColor = "#0E2847"

[server]
headless = true
runOnSave = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
