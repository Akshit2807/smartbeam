[theme]
base = "dark"
primaryColor = "#88C0D0"
backgroundColor = "#2E3440"
secondaryBackgroundColor = "#3B4252"
textColor = "#ECEFF4"
borderColor = "#4C566A"
linkColor = "#88C0D0"
font = "Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"
codeFont = "'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace"
baseRadius = "0.6rem"
chartCategoricalColors = ["#88C0D0", "#EBCB8B", "#B48EAD", "#A3BE8C", "#81A1C1", "#BF616A"]

[theme.sidebar]
backgroundColor = "#3B4252"

[server]
headless = true
runOnSave = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
