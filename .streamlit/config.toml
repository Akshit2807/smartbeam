[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111A2B"
textColor = "#E6EDF7"
borderColor = "#24324D"
linkColor = "#22D3EE"
font = "Inter, 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"
codeFont = "'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace"
baseRadius = "0.6rem"
chartCategoricalColors = ["#22D3EE", "#F5A524", "#A78BFA", "#34D399", "#60A5FA", "#F87171"]

[theme.sidebar]
backgroundColor = "#111A2B"

[server]
headless = true
runOnSave = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
